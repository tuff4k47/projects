# Opens pull requests when a pinned dependency or a GitHub Action has a new
# release. Each pull request runs the Tests workflow, so you can see whether the
# upgrade is safe before merging it.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/integration_calculator"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
